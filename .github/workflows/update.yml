name: Update car listings

on:
  schedule:
    - cron: '7,37 * * * *'    # every 30 min. Full listing scan every hour, live bids every 30 min.
  workflow_dispatch:          # "Run workflow" button for a manual refresh
    inputs:
      full:
        description: 'Force a full scan now'
        type: boolean
        default: true

permissions:
  contents: write             # lets the job save the new data back into the repo

concurrency:
  group: update-listings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect listings
        env:
          PICKLES_AREAS: ${{ vars.PICKLES_AREAS || 'qld' }}
          FULL_EVERY_HOURS: ${{ vars.FULL_EVERY_HOURS || '0.9' }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          # Optional: add these under Settings > Secrets and variables > Actions to get car cards pushed to chat
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          NOTIFY_MIN_PROFIT: ${{ vars.NOTIFY_MIN_PROFIT || '1000' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full }}" = "true" ]; then
            python scraper/scrape.py --full
          else
            python scraper/scrape.py
          fi

      - name: Save data
        run: |
          git config user.name "flip-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Listings update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --quiet || true
            git push
          fi
